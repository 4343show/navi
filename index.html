<meta charset="UTF-8">

<title>シン多摩いち ナビ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; padding: 12px; max-width: 420px; margin: 0 auto; min-height: 100vh; -webkit-text-size-adjust: 100%; }
#clock { text-align: center; padding: 8px 0 10px; }
#clock-hhmm { font-size: 88px; font-weight: 900; letter-spacing: -2px; line-height: 1; color: #FFE033; font-variant-numeric: tabular-nums; }

#clock-ss { font-size: 26px; color: #886600; margin-top: 2px; font-variant-numeric: tabular-nums; font-weight: 700; }
#main-card { border-radius: 10px; padding: 16px; margin-bottom: 10px; border-width: 3px; border-style: solid; }
#main-status { font-size: 22px; font-weight: 900; text-align: center; margin-bottom: 12px; letter-spacing: 0.02em; }
#main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.main-cell { text-align: center; }
.main-label { font-size: 11px; color: #888; margin-bottom: 4px; font-weight: 600; letter-spacing: 0.05em; }
.main-value { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.main-sub { font-size: 12px; margin-top: 3px; font-weight: 700; }
#main-speed { margin-top: 12px; border-top: 1px solid #333; padding-top: 10px; }
#progress-bar-wrap { margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
#progress-label { font-size: 11px; color: #888; margin-bottom: 4px; font-weight: 600; display: flex; justify-content: space-between; }
#progress-bar-bg { background: #222; border-radius: 4px; height: 8px; }
#progress-bar-fill { background: #00cc55; border-radius: 4px; height: 8px; width: 0%; transition: width 1s; }
#gps-panel { background: #111; border: 2px solid #2a2a2a; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
#gps-row { display: flex; align-items: center; gap: 8px; }
#gps-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #aa8800; }
#gps-text { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: #aaa; }
#gps-sub { font-size: 11px; color: #666; margin-top: 3px; padding-left: 18px; }
#gps-btns { display: flex; gap: 6px; }
.gps-btn { border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; border-width: 2px; border-style: solid; }
#manual-btn { background: #1a1a50; color: #aaaaff; border-color: #4444aa; }
#reset-btn { background: #1a3a1a; color: #aaffaa; border-color: #44aa44; }
#manual-panel { margin-top: 10px; border-top: 1px solid #2a2a2a; padding-top: 10px; display: none; }
#manual-panel.open { display: block; }
#manual-hint { font-size: 11px; color: #666; margin-bottom: 6px; }
#manual-row { display: flex; gap: 6px; }
#manual-input { flex: 1; background: #1a1a1a; color: #fff; border: 2px solid #333; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
#manual-ok { background: #003a1a; color: #00ee66; border: 2px solid #00aa44; border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
#manual-error { font-size: 11px; color: #ff5555; margin-top: 5px; font-weight: 600; }
#manual-clear { margin-top: 5px; background: none; color: #555; border: none; font-size: 11px; cursor: pointer; display: none; }
#checkpoints { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.cp { border-radius: 8px; padding: 10px 14px; border-width: 2px; border-style: solid; }
.cp-row { display: flex; justify-content: space-between; align-items: center; }
.cp-name { font-size: 15px; font-weight: 800; }
.cp-meta { font-size: 11px; color: #666; margin-top: 2px; }
.cp-dl { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; }
.cp-cd { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; margin-top: 2px; }
.cp-rem { font-size: 12px; color: #55aaff; margin-top: 3px; }
#footer { padding: 8px 12px; background: #111; border-radius: 6px; font-size: 11px; color: #444; line-height: 1.8; }
</style>
</head>

  </div>
</div>
<div id="gps-panel">

    <div id="gps-dot"></div>

  <div id="gps-sub"></div>
  <div id="manual-panel">

</div>
<div id="checkpoints"></div>

  const isOnTime=etaNowMs&&etaNowMs<=dl,marginMs=etaNowMs?dl-etaNowMs:null;
  let statusText,cardBg,cardBorder,statusColor;
  if(!ag){statusText="GPS取得中…";cardBg="#111";cardBorder="#333";statusColor="#888";}
  else if(!onRoute){statusText="ルート外 / スタート前";cardBg="#111";cardBorder="#444";statusColor="#666";}
  else if(!speedMs){statusText="速度計測中…";cardBg="#111";cardBorder="#333";statusColor="#888";}
  else if(etaNowMs&&etaNowMs>dl){statusText="🚨 引き返してください";cardBg="#220000";cardBorder="#ff2222";statusColor="#ff4444";}
  else if(canGoKm!==null&&canGoKm<0.5){statusText="⚠️ そろそろ折り返し";cardBg="#1a1400";cardBorder="#ffcc00";statusColor="#ffcc00";}
  else{statusText="✅ 順調";cardBg="#001a0a";cardBorder="#00cc55";statusColor="#00cc55";}
  const mc=document.getElementById("main-card");mc.style.background=cardBg;mc.style.borderColor=cardBorder;
  document.getElementById("main-status").style.color=statusColor;document.getElementById("main-status").textContent=statusText;
  const etaEl=document.getElementById("eta-now"),etaMEl=document.getElementById("eta-now-margin");
  if(etaNow){etaEl.textContent=etaNow;etaEl.style.color=isOnTime?"#fff":"#ff4444";if(marginMs!==null){const absMins=Math.floor(Math.abs(marginMs)/60000);etaMEl.textContent=(marginMs>=0?"余裕 ":"超過 ")+absMins+"分";etaMEl.style.color=marginMs>=0?"#00cc55":"#ff4444";}}
  else{etaEl.textContent="--:--";etaMEl.textContent=!ag?"GPS待ち":!onRoute?"ルート外":sampleCount<MIN_SAMPLES?"計測中 "+sampleCount+"/"+MIN_SAMPLES:"--";etaEl.style.color="#888";etaMEl.style.color="#555";}
  const cgEl=document.getElementById("can-go");
  if(canGoKm!==null){cgEl.textContent=canGoKm.toFixed(1);cgEl.style.color=canGoKm<1?"#ff4444":canGoKm<3?"#ffcc00":"#fff";}
  else{cgEl.textContent="-.-";cgEl.style.color="#888";}
  const nsEl=document.getElementById("need-speed"),csEl=document.getElementById("cur-speed"),spEl=document.getElementById("speed-status");
  if(needSpeedKmh!==null){nsEl.textContent=needSpeedKmh.toFixed(1);nsEl.style.color=(speedKmh&&speedKmh>=needSpeedKmh)?"#00cc55":"#ff6666";}else{nsEl.textContent="--.-";nsEl.style.color="#888";}
  if(speedKmh!==null)csEl.textContent=speedKmh.toFixed(1);else csEl.textContent="--.-";
  if(ag&&onRoute&&sampleCount<MIN_SAMPLES){spEl.textContent="速度サンプル蓄積中 "+sampleCount+"/"+MIN_SAMPLES;spEl.style.color="#555";}else spEl.textContent="";
  let nextIdx=-1;
  const cpData=CP.map((cp,i)=>{const cpDlMs=dlMs(cp.dl),rem=cpDlMs-ms;const dist=ag?hav(ag.lat,ag.lon,cp.lat,cp.lon):null;const passed=dist!==null&&dist<150;const od=rem<0&&!passed,urg=rem>0&&rem<20*60000&&!passed;if(!passed&&nextIdx<0)nextIdx=i;return{...cp,rem,dist,passed,od,urg};});
  const con=document.getElementById("checkpoints");con.innerHTML="";
  cpData.forEach((cp,i)=>{
    const isNext=i===nextIdx;let bc,bg,nc,dc,cc;
    if(cp.passed){bc="#222";bg="#0a0a0a";nc="#555";dc="#555";cc="#555";}
    else if(cp.od){bc="#ff2222";bg="#1a0000";nc="#ff6666";dc="#ff3333";cc="#ff3333";}
    else if(cp.urg){bc="#ffcc00";bg="#1a1400";nc="#ffee44";dc="#ffcc00";cc="#ffcc00";}
    else if(isNext){bc="#0088ff";bg="#001225";nc="#44aaff";dc="#fff";cc="#6699ff";}
    else{bc="#2a2a2a";bg="#0d0d0d";nc="#aaa";dc="#ccc";cc="#555";}
    let distInfo="";
    if(onRoute&&!cp.passed&&remM!==null){const toNext=remM-cp.rem_m;distInfo=toNext>0?"あと "+(toNext/1000).toFixed(1)+" km":"通過済または近傍";}
    else if(!ag)distInfo="出発から "+(TOTAL_M/1000-(cp.rem_m/1000)).toFixed(1)+" km地点";
    else if(!onRoute)distInfo="ルート外";
    const prefix=cp.passed?"✓ ":isNext?"▶ ":"　";
    const cdTxt=cp.passed?"":cp.od?"+"+fmtCD(cp.rem)+" 超過":"残 "+fmtCD(cp.rem);
    const d=document.createElement("div");d.className="cp";d.style.background=bg;d.style.borderColor=bc;d.style.opacity=cp.passed?"0.3":"1";
    d.innerHTML=`<div class="cp-row"><div><div class="cp-name" style="color:${nc}">${prefix}${cp.name}</div><div class="cp-meta">${cp.note}</div>${distInfo?`<div class="cp-rem">${distInfo}</div>`:""}</div><div><div class="cp-dl" style="color:${dc}">${cp.dl}</div>${!cp.passed?`<div class="cp-cd" style="color:${cc}">${cdTxt}</div>`:""}</div></div>`;
    con.appendChild(d);
  });
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
